name = "ence"
main = "worker.js"
compatibility_date = "2026-10-01"

# Create with: npx wrangler kv namespace create ENCE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "ENCE_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Set this to your site's origin once it is live, e.g. "https://ence-farewell.pages.dev"
ALLOWED_ORIGIN = "*"
